name: QA_Deployment_Process

on:
  push:
    branches: [ develop ]

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        service: [
          identity-service, 
          patient-service, 
          medical-service, 
          iot-service, 
          appointment-service, 
          billing-service, 
          inventory-service, 
          notification-service, 
          staff-service, 
          audit-service, 
          api-gateway
        ]

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_QA }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: qa
        run: |
          # CAMBIO IMPORTANTE:
          # 1. "-f ./apps/.../Dockerfile" -> Le dice dónde está el archivo de instrucciones.
          # 2. " ." (el punto al final) -> Le dice que use la RAÍZ del proyecto para buscar archivos (package.json).
          docker build -t $ECR_REGISTRY/vet-${{ matrix.service }}:$IMAGE_TAG -f ./apps/${{ matrix.service }}/Dockerfile .
          docker push $ECR_REGISTRY/vet-${{ matrix.service }}:$IMAGE_TAG

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster vet-system-qa-cluster --service ${{ matrix.service }} --force-new-deployment