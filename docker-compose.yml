version: '3.9'

services:
  # ----------------------------------------
  # DATABASES LAYER
  # ----------------------------------------

  postgres:
    image: postgres:15-alpine
    container_name: vet_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Veterinaria2026!
      POSTGRES_DB: veterinary_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vet_network

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: vet_dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    networks:
      - vet_network

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: vet_dynamodb_admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: "http://vet_dynamodb:8000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
    depends_on:
      - dynamodb-local
    networks:
      - vet_network

  influxdb:
    image: influxdb:2.7
    container_name: vet_influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: veterinaria_org
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    networks:
      - vet_network

  redis:
    image: redis:alpine
    container_name: vet_redis
    ports:
      - "6379:6379"
    networks:
      - vet_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vet_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - vet_network

  mosquitto:
    image: eclipse-mosquitto
    container_name: vet_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - vet_network

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: vet_zookeeper
    ports:
      - "2181:2181"
    networks:
      - vet_network

  kafka:
    image: wurstmeister/kafka
    container_name: vet_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "crear_factura:1:1,staff_status_changed:1:1,inventory_reduced:1:1,patient_created:1:1"
    depends_on:
      - zookeeper
    networks:
      - vet_network

  # ----------------------------------------
  # MICROSERVICES LAYER
  # ----------------------------------------

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: identity-service
    env_file:
      - apps/identity-service/.env
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - vet_network

  patient-service:
    build:
      context: .
      dockerfile: apps/patient-service/Dockerfile
    container_name: patient-service
    ports:
      - "3002:3002"
    env_file:
      - apps/patient-service/.env
    depends_on:
      - dynamodb-local
      - kafka
    networks:
      - vet_network

  medical-service:
    build:
      context: .
      dockerfile: apps/medical-service/Dockerfile
    container_name: medical-service
    ports:
      - "3003:3003"
    env_file:
      - apps/medical-service/.env
    depends_on:
      - dynamodb-local
      - kafka
    networks:
      - vet_network

  iot-service:
    build:
      context: .
      dockerfile: apps/iot-service/Dockerfile
    container_name: iot-service
    ports:
      - "3004:3004"
    env_file:
      - apps/iot-service/.env
    depends_on:
      - influxdb
      - mosquitto
    networks:
      - vet_network

  appointment-service:
    build:
      context: .
      dockerfile: apps/appointment-service/Dockerfile
    container_name: appointment-service
    ports:
      - "3005:3005"
    env_file:
      - apps/appointment-service/.env
    depends_on:
      - postgres
      - rabbitmq
      - kafka
    networks:
      - vet_network

  billing-service:
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    container_name: billing-service
    ports:
      - "3006:3006"
    env_file:
      - apps/billing-service/.env
    depends_on:
      - postgres
      - kafka
    networks:
      - vet_network

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "3007:3007"
    env_file:
      - apps/inventory-service/.env
    depends_on:
      - postgres
      - kafka
    networks:
      - vet_network

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "3008:3008"
    env_file:
      - apps/notification-service/.env
    depends_on:
      - kafka
    networks:
      - vet_network

  staff-service:
    build:
      context: .
      dockerfile: apps/staff-service/Dockerfile
    container_name: staff-service
    ports:
      - "3009:3009"
    env_file:
      - apps/staff-service/.env
    depends_on:
      - postgres
      - rabbitmq
      - kafka
    networks:
      - vet_network

  audit-service:
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
    container_name: audit-service
    ports:
      - "3010:3010"
    env_file:
      - apps/audit-service/.env
    depends_on:
      - postgres
      - kafka
    networks:
      - vet_network

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    env_file:
      - apps/api-gateway/.env
    depends_on:
      - identity-service
      - patient-service
      - medical-service
      - iot-service
      - appointment-service
      - billing-service
      - inventory-service
      - notification-service
      - staff-service
      - audit-service
    networks:
      - vet_network

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_log:

networks:
  vet_network:
    driver: bridge
